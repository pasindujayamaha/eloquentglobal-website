name: Replace contact email

on:
  push:
    paths:
      - '.github/workflows/replace-contact-email.yml'

permissions:
  contents: write

jobs:
  replace-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace old company email everywhere
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_variants = [
              'jayamaha007@gmail.com',
              'JAYAMAHA007@GMAIL.COM',
              'Jayamaha007@gmail.com'
          ]
          new = 'contactus@eloquentglobal.com'

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.as_posix() == '.github/workflows/replace-contact-email.yml':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old in old_variants:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(path)
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No old email references found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace old company email across website"
          git push
